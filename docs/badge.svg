<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="280" height="50" viewBox="0 0 280 50">
  <rect width="280" height="50" rx="6" fill="#121212" stroke="#d90000" stroke-width="2"/>
  
  <!-- Moddex Logo Group -->
  <g transform="translate(10, 8)">
    <image href="https://media.moddex.gg/branding/ModDex%20Full%20Logo.svg" width="100" height="34" preserveAspectRatio="xMidYMid meet"/>
    <!-- Red Cross strictly at Top-Left Corner of Logo -->
    <line x1="6" y1="6" x2="14" y2="14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="6" x2="6" y2="14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Separator Line -->
  <line x1="120" y1="8" x2="120" y2="42" stroke="#333333" stroke-width="2"/>
  
  <!-- Badge Text -->
  <text x="132" y="22" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="1">WE ARE</text>
  <text x="132" y="38" fill="#D90000" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1">AGAINST MODDEX</text>
</svg>
